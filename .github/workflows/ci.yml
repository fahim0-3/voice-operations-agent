name: CI

# why CI runs only the fast, network/credential-free test path: this
# project's providers include real AWS Bedrock/OpenAI calls, and the
# server-side pipeline needs a real GPU for faster-whisper - none of
# that is available (or appropriate) in a shared CI runner. CI instead
# validates exactly what tests/test_providers.py's FakeProvider was
# designed for: the pure logic (tool-calling hop loop, protocol schemas,
# tool registry, sentence splitting) that doesn't need a GPU or
# credentials to verify - see docs/14-testing-and-ci.md.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.11

      - name: Install CPU-only deps (skip CUDA torch index for CI speed)
        run: uv sync --no-install-package torch

      - name: Ruff lint
        run: uv run ruff check .

      - name: Run tests (excluding GPU/model-loading-heavy ones)
        run: uv run pytest -v -k "not vad and not tts" --ignore=tests/test_vad.py --ignore=tests/test_tts.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npx tsc --noEmit -p tsconfig.json
